name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Delete existing release if present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push cask to homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${TAP_TOKEN}@github.com/urechandro/homebrew-ripple.git /tmp/homebrew-ripple
          mkdir -p /tmp/homebrew-ripple/Casks
          FILE=/tmp/homebrew-ripple/Casks/ripple.rb
          cp dist/homebrew/Casks/ripple.rb "$FILE"
          LINES=$(wc -l < "$FILE")
          head -n $((LINES - 1)) "$FILE" > /tmp/ripple.tmp
          printf '  postflight do\n    system "xattr", "-d", "com.apple.quarantine", "#{staged_path}/ripple"\n  end\n\nend\n' >> /tmp/ripple.tmp
          mv /tmp/ripple.tmp "$FILE"
          cd /tmp/homebrew-ripple
          git add Casks/ripple.rb
          git commit -m "chore: update ripple cask to ${GITHUB_REF_NAME}"
          git push
